spring.application.name=correspondencia

# Perfil activo por defecto (se sobrescribe con SPRING_PROFILES_ACTIVE)
spring.profiles.active=dev

# JPA / Hibernate: config compartida entre perfiles
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway: migraciones versionadas del esquema
# baseline-on-migrate=true permite tratar una BD ya existente como baseline (V1)
# sin re-ejecutar el script inicial. Los cambios futuros se aplican con V2, V3, etc.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema inicial (baseline)

# Parametros de negocio propios (leidos con @Value o @ConfigurationProperties)
correspondencia.seguridad.max-intentos-login=5
correspondencia.seguridad.jwt-expiracion-minutos=120
# Secreto por defecto solo para dev - en prod SIEMPRE vía variable de entorno CORRESPONDENCIA_SEGURIDAD_JWT_SECRETO
correspondencia.seguridad.jwt-secreto=${CORRESPONDENCIA_SEGURIDAD_JWT_SECRETO:desarrollo-cambia-este-secreto-en-produccion-por-favor-32chars}
# Origenes permitidos para CORS. Acepta varios separados por coma.
# Ej.: CORRESPONDENCIA_SEGURIDAD_CORS_ORIGINS=https://prod.midominio.com,https://staging.midominio.com
correspondencia.seguridad.cors-origins=${CORRESPONDENCIA_SEGURIDAD_CORS_ORIGINS:http://localhost:5173}

# Admin inicial: solo se usa en produccion cuando no existe ningun usuario ADMIN.
# Si falta alguna variable, el inicializador loguea un WARN y no crea nada.
correspondencia.admin-inicial.username=${ADMIN_INICIAL_USERNAME:}
correspondencia.admin-inicial.password=${ADMIN_INICIAL_PASSWORD:}

# Modo demo: siembra usuarios y datos de ejemplo, expone /demo/info y resetea de madrugada.
# En produccion, si habilitado=true SIEMPRE hay que definir CORRESPONDENCIA_DEMO_PASSWORD;
# si no, la app no arranca (DemoConfigValidator).
correspondencia.demo.habilitado=${CORRESPONDENCIA_DEMO_HABILITADO:false}
correspondencia.demo.password=${CORRESPONDENCIA_DEMO_PASSWORD:demo1234}
correspondencia.demo.cron=${CORRESPONDENCIA_DEMO_CRON:0 0 3 * * *}
correspondencia.demo.zona=${CORRESPONDENCIA_DEMO_ZONA:America/Mexico_City}

# Actuator: solo exponemos /actuator/health para healthcheck de Railway.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
